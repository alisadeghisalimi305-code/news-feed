<style>
:root{
  --bg:#f5f2eb; --card:#fffdf9; --ink:#1c1a15; --muted:#7b7465; --line:#e7e1d2;
  --accent:#c2410c; --accent-soft:#fdeadb; --ok:#15803d; --bad:#b91c1c;
  --shadow:0 1px 2px rgba(60,40,10,.05),0 10px 28px rgba(60,40,10,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13120e; --card:#1c1a15; --ink:#f1ede3; --muted:#9a9384; --line:#2e2b23;
    --accent:#fb923c; --accent-soft:#2c1d12; --ok:#4ade80; --bad:#f87171; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#13120e; --card:#1c1a15; --ink:#f1ede3; --muted:#9a9384; --line:#2e2b23;
  --accent:#fb923c; --accent-soft:#2c1d12; --ok:#4ade80; --bad:#f87171; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;line-height:1.85}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:30px 0 14px}
.brand small{display:block;color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:.02em}
.brand h1{margin:0;font-size:clamp(24px,6vw,32px);line-height:1.3;font-weight:800}
.iconbtn{font:inherit;font-size:17px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;margin:0 -16px;padding:8px 16px 12px;background:linear-gradient(var(--bg) 82%,transparent)}
.tabs-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.panel{padding-top:8px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* shared */
.head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin:6px 0 12px}
.head h2{margin:0;font-size:19px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.warn{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0 0 14px}
.err{font-size:13px;color:var(--bad);margin:0 0 12px}
input[type=search],input[type=text]{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none}
input:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:14px;font-weight:700;text-decoration:none;color:#fff;background:var(--accent);border:0;border-radius:12px;padding:9px 16px;cursor:pointer}
.btn.ghost{color:var(--ink);background:none;border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:56px 0}

/* telegram */
.day{margin:24px 0 10px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
article.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
article.post.new{border-inline-start:4px solid var(--accent)}
.text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.text a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.text.clamp{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.more{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer}
.pics{display:grid;gap:4px;margin:0 -16px 10px;grid-template-columns:1fr}
.pics.n2{grid-template-columns:1fr 1fr}.pics.n3,.pics.n4{grid-template-columns:1fr 1fr}
.pics.n3 figure:first-child{grid-column:1/-1}
.pics figure{margin:0;position:relative;background:var(--line);aspect-ratio:4/3;overflow:hidden}
.pics.n1 figure{aspect-ratio:auto;max-height:520px}
.pics img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.pics.n1 img{height:auto;max-height:520px}
.dl{position:absolute;inset-inline-start:8px;bottom:8px;width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;text-decoration:none;display:grid;place-items:center;font-size:16px}
.vid{display:inline-block;font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:2px 10px;margin:2px 0 8px;text-decoration:none}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:12.5px}
.foot a{text-decoration:none}.foot a:hover{color:var(--accent)}
mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 2px}

/* lightbox */
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,9,6,.92);display:grid;place-items:center;padding:16px}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:82vh;border-radius:10px}
#lb .bar{position:absolute;top:14px;inset-inline:14px;display:flex;justify-content:space-between}
#lb .bar a,#lb .bar button{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:12px;padding:8px 14px;text-decoration:none;cursor:pointer}

/* moto + prices */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.seg button{font:inherit;font-size:13.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.mcard{margin-bottom:12px}
.mcard h3{margin:0 0 8px;font-size:17px}
.prov{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.prov span{font-size:12.5px;color:var(--muted);min-width:64px}
.lnk{font-size:13.5px;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.lnk:hover{border-color:var(--accent);color:var(--accent)}
.store{display:grid;gap:10px;margin-bottom:12px}
.store .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.store h3{margin:0;font-size:17px;flex:1}
.log{font-size:13px;color:var(--muted);margin:0}
.log b{color:var(--ink)}
.up{color:var(--bad)}.down{color:var(--ok)}
.price-in{max-width:190px;direction:ltr;text-align:right}

/* youtube */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.thumb{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;display:block;width:100%;border:0;padding:0}
.thumb img,.thumb iframe{width:100%;height:100%;object-fit:cover;display:block;border:0}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:34px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.thumb .dur{position:absolute;inset-inline-start:8px;bottom:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.7);border-radius:6px;padding:0 7px;direction:ltr}
.vbody{padding:10px 14px 12px}
.vbody h4{margin:0 0 4px;font-size:15px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:8px;padding:0 8px}
ol.steps{margin:8px 0 0;padding-inline-start:20px;font-size:14px}
code{direction:ltr;unicode-bidi:embed;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:13px}
</style>
</head>

  if (s < 3600) return r.format(-Math.max(1, Math.round(s / 60)), 'minute');
  if (s < 86400) return r.format(-Math.round(s / 3600), 'hour');
  return r.format(-Math.round(s / 86400), 'day');
};
const dur = s => { if (!s) return ''; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60, p = n => String(n).padStart(2,'0');
  return h ? `${h}:${p(m)}:${p(x)}` : `${m}:${p(x)}`; };
const upd = (iso, hours) => iso
  ? `<span class="chip" title="${esc(fa({dateStyle:'medium', timeStyle:'short'}, new Date(iso)))}"><span class="dot"></span>به‌روزرسانی ${relTime(iso)}${hours ? ' · هر ' + nf(hours) + ' ساعت' : ''}</span>`
  : '<span class="chip"><span class="dot warn"></span>هنوز داده‌ای نیست</span>';
const $ = s => document.querySelector(s);

document.getElementById('gen').textContent = 'ساخته‌شده ' + fa({dateStyle:'medium', timeStyle:'short'}, new Date(D.generated));

/* ---------------- Telegram ---------------- */
function renderTG(el) {
  const tg = D.telegram || {}, posts = tg.posts || [];
  el.innerHTML = `
    <div class="head"><h2>${esc(tg.title || 'تلگرام')}</h2>${upd(tg.updated, D.intervals.telegram)}</div>
    ${tg.error ? `<p class="err">خطا در آخرین به‌روزرسانی: ${esc(tg.error)}</p>` : ''}
    <input type="search" id="q" placeholder="جستجو در خبرها…" style="margin-bottom:6px">
    <div id="list"></div>`;
  const draw = f => {
    const list = $('#list'); f = (f || '').trim();
    const rows = f ? posts.filter(p => (p.text || '').includes(f)) : posts;
    if (!rows.length) { list.innerHTML = `<div class="empty">${posts.length ? 'چیزی پیدا نشد.' : 'هنوز پستی دریافت نشده.'}</div>`; return; }
    let html = '', last = '';
    const hrs = D.intervals.telegram || 2;
    for (const p of rows) {
      const d = p.date ? new Date(p.date) : null, day = d ? fa({dateStyle:'full'}, d) : '';
      if (day !== last) { html += `<div class="day">${day}</div>`; last = day; }
      let t = linkify(esc(p.text || ''));
      if (f) t = t.split(esc(f)).join('<mark>' + esc(f) + '</mark>');
      const imgs = (p.images || []).filter(i => i.src || i.remote);
      const pics = imgs.length ? `<div class="pics n${Math.min(imgs.length, 4)}">` + imgs.slice(0, 4).map(i => {
        const s = i.src || i.remote, alt = i.remote || '';
        return `<figure><img loading="lazy" src="${esc(s)}" data-alt="${esc(alt)}" data-lb="${esc(s)}" onerror="if(this.dataset.alt&&this.src!==this.dataset.alt)this.src=this.dataset.alt" alt="">` +
               `<a class="dl" href="${esc(s)}" download title="دانلود">⬇</a></figure>`; }).join('') + '</div>' : '';
      const long = (p.text || '').length > 520;
      const isNew = d && (Date.now() - d) < hrs * 3600 * 1000;
      html += `<article class="post${isNew ? ' new' : ''}">${pics}` +
        (t ? `<div class="text${long ? ' clamp' : ''}">${t}</div>` : '') +
        (long ? '<button class="more">ادامه‌ی متن</button>' : '') +
        (p.has_video ? `<a class="vid" href="${esc(p.url)}" target="_blank" rel="noopener">🎞 این پست ویدیو هم دارد — در تلگرام ببین</a>` : '') +
        `<div class="foot"><span>${d ? fa({timeStyle:'short'}, d) : ''}${p.views ? ' · ' + esc(p.views) + ' بازدید' : ''}</span>` +
        `<a href="${esc(p.url)}" target="_blank" rel="noopener">تلگرام ↗</a></div></article>`;
    }
    list.innerHTML = html;
  };
  draw();
  $('#q').addEventListener('input', e => draw(e.target.value));
}

/* ---------------- Motorcycles (Divar links) ---------------- */
let motoMode = 'parking';
function renderMoto(el) {
  const c = D.divar || {}, modes = c.modes || [], cities = c.cities || [], models = c.models || [];
  const mode = modes.find(m => m.id === motoMode) || modes[0] || {word: ''};
  const url = (city, model) => {
    const q = [c.prefix, model.q, mode.word].filter(Boolean).join(' ');
    return `https://divar.ir/s/${city.slug}${c.category ? '/' + c.category : ''}?q=${encodeURIComponent(q)}`;
  };
  const provs = [...new Set(cities.map(x => x.province))];
  el.innerHTML = `
    <div class="head"><h2>موتور · دیوار</h2></div>
    <p class="note">دیوار اجازه‌ی خواندن خودکار آگهی‌هایش را نمی‌دهد، برای همین این‌جا لینک‌های جستجوی آماده می‌بینی. با یک لمس، <b>تازه‌ترین نتایج</b> مستقیم در خود دیوار باز می‌شود. در دیوار هم می‌توانی جستجو را ذخیره کنی تا برای آگهی جدید خبرت کند.</p>
    <div class="seg" id="modes">${modes.map(m => `<button aria-pressed="${m.id === mode.id}" data-m="${m.id}">${esc(m.label)}</button>`).join('')}</div>
    ${models.map(m => `<section class="card mcard"><h3>${esc(m.name)}</h3>${provs.map(p =>
      `<div class="prov"><span>${esc(p)}</span>${cities.filter(x => x.province === p).map(x =>
        `<a class="lnk" target="_blank" rel="noopener" href="${esc(url(x, m))}">${esc(x.name)}</a>`).join('')}</div>`).join('')}</section>`).join('')}`;
  el.querySelectorAll('#modes button').forEach(b => b.onclick = () => { motoMode = b.dataset.m; renderMoto(el); });
}

/* ---------------- PS5 prices ---------------- */
const digits = s => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d]/g, '');
const logKey = 'ps5log';
const getLog = () => { try { return JSON.parse(localStorage.getItem(logKey)) || {}; } catch { return {}; } };
const setLog = v => { try { localStorage.setItem(logKey, JSON.stringify(v)); } catch {} };
function renderPS(el) {
  const c = D.prices || {}, stores = c.stores || [], log = getLog();
  let q = c.query || c.product || '';
  const logHTML = id => {
    const a = log[id] || [];
    if (!a.length) return '<p class="log">هنوز قیمتی ثبت نکرده‌ای.</p>';
    const last = a[a.length - 1], prev = a[a.length - 2];
    let delta = '';
    if (prev) { const d = last.p - prev.p, pc = Math.abs(d / prev.p * 100).toFixed(1);
      delta = d === 0 ? ' · بدون تغییر' : ` · <span class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${nf(Math.abs(d))} (${pc}٪)</span>`; }
    return `<p class="log">آخرین: <b>${nf(last.p)} تومان</b> · ${fa({dateStyle:'medium'}, new Date(last.d))}${delta}</p>` +
      `<p class="log">${a.slice(-6, -1).reverse().map(x => fa({month:'numeric', day:'numeric'}, new Date(x.d)) + ': ' + nf(x.p)).join(' | ')}</p>`;
  };
  el.innerHTML = `
    <div class="head"><h2>${esc(c.product || 'قیمت')}</h2></div>
    <p class="note">این فروشگاه‌ها هم خواندن خودکار صفحه‌هایشان را مجاز نمی‌کنند. دکمه‌ها نتیجه‌ی زنده را در خود فروشگاه باز می‌کنند. قیمت امروز را اگر خواستی دستی ثبت کن تا روند تغییر را این‌جا ببینی (فقط روی همین دستگاه ذخیره می‌شود). در ترب و دیجی‌کالا «هشدار قیمت» هم هست.</p>
    <input type="text" id="pq" value="${esc(q)}" style="margin-bottom:12px" aria-label="عبارت جستجو">
    ${stores.map(s => `<section class="card store" data-s="${esc(s.id)}">
      <div class="row"><h3>${esc(s.name)}</h3><a class="btn" data-u="${esc(s.url)}" target="_blank" rel="noopener" href="#">جستجو ↗</a></div>
      <div class="row"><input type="text" class="price-in" inputmode="numeric" placeholder="قیمت امروز (تومان)"><button class="btn ghost" data-save="${esc(s.id)}">ثبت</button></div>
      <div id="lg-${esc(s.id)}">${logHTML(s.id)}</div></section>`).join('')}`;
  const setLinks = () => el.querySelectorAll('a[data-u]').forEach(a => a.href = a.dataset.u.replace('{q}', encodeURIComponent($('#pq').value.trim())));
  setLinks(); $('#pq').addEventListener('input', setLinks);
  el.querySelectorAll('[data-save]').forEach(b => b.onclick = () => {
    const id = b.dataset.save, inp = b.parentElement.querySelector('input'), p = parseInt(digits(inp.value), 10);
    if (!p) { inp.focus(); return; }
    (log[id] = log[id] || []).push({d: new Date().toISOString(), p}); setLog(log);
    inp.value = ''; $('#lg-' + id).innerHTML = logHTML(id);
  });
}

/* ---------------- YouTube ---------------- */
let ytShown = 10;
function renderYT(el) {
  const y = D.youtube || {}, items = y.items || [], fresh = new Set(y.new_ids || []);
  let body;
  if (y.status === 'no_key' && !items.length) {
    body = `<div class="card"><h3 style="margin:0 0 6px">یک کلید رایگان یوتیوب لازم است</h3>
      <p class="log">یوتیوب فقط از راه رسمی‌اش (API) اجازه‌ی جستجو می‌دهد. یک‌بار این مراحل را انجام بده:</p>
      <ol class="steps">
        <li>در <code>console.cloud.google.com</code> یک پروژه‌ی جدید بساز.</li>
        <li>گزینه‌ی <code>YouTube Data API v3</code> را Enable کن.</li>
        <li>از Credentials یک <code>API key</code> بساز و کپی کن.</li>
        <li>در GitHub: مخزن ← Settings ← Secrets and variables ← Actions ← New repository secret؛ نام: <code>YOUTUBE_API_KEY</code> و مقدار: همان کلید.</li>
        <li>در تب Actions گزینه‌ی Run workflow را با تیک force بزن.</li></ol></div>`;
  } else if (!items.length) {
    body = `<div class="empty">${y.error ? '' : 'هنوز ویدیویی پیدا نشده.'}</div>`;
  } else {
    const shown = items.slice(0, ytShown);
    body = `<div class="grid">${shown.map(v => `<article class="vcard">
      <button class="thumb" data-yt="${esc(v.id)}" aria-label="پخش"><img loading="lazy" src="${esc(v.thumb)}" alt=""><span class="play">▶</span>${v.duration ? `<span class="dur">${dur(v.duration)}</span>` : ''}</button>
      <div class="vbody"><h4>${esc(v.title)}</h4><div class="vmeta">${fresh.has(v.id) ? '<span class="badge">جدید</span>' : ''}<span>${esc(v.channel)}</span><span>· ${relTime(v.published)}</span>${v.views ? `<span>· ${nf(v.views)} بازدید</span>` : ''}</div>
      <div class="vmeta" style="margin-top:6px"><a href="${esc(v.url)}" target="_blank" rel="noopener">باز کردن در یوتیوب ↗</a></div></div></article>`).join('')}</div>` +
      (items.length > ytShown ? '<p style="text-align:center;margin-top:14px"><button class="btn ghost" id="moreyt">نمایش بیشتر</button></p>' : '');
  }
  el.innerHTML = `<div class="head"><h2>یوتیوب · ساخت ویدیو با هوش مصنوعی</h2>${upd(y.updated, D.intervals.youtube)}</div>
    ${y.error ? `<p class="err">خطا در آخرین به‌روزرسانی: ${esc(y.error)}</p>` : ''}
    <p class="note">فقط ویدیوهای فارسی و غیرتکراری؛ هر ویدیو یک بار آورده می‌شود. پخش یوتیوب در ایران ممکن است VPN بخواهد.</p>${body}`;
  const m = $('#moreyt'); if (m) m.onclick = () => { ytShown += 10; renderYT(el); };
}

/* ---------------- tabs + events ---------------- */
const TABS = [
  {id: 'tg',   label: '✈️ تلگرام',     fn: renderTG},
  {id: 'moto', label: '🏍️ موتور',      fn: renderMoto},
  {id: 'ps5',  label: '🎮 پلی‌استیشن', fn: renderPS},
  {id: 'yt',   label: '▶️ یوتیوب',     fn: renderYT},
];
const nav = $('#tabs'), panel = $('#panel');
nav.innerHTML = TABS.map(t => `<button class="tab" role="tab" data-t="${t.id}">${t.label}</button>`).join('');
function show(id) {
  const t = TABS.find(x => x.id === id) || TABS[0];
  nav.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t.id));
  panel.innerHTML = ''; t.fn(panel);
  if (location.hash !== '#' + t.id) history.replaceState(null, '', '#' + t.id);
}
nav.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { show(b.dataset.t); window.scrollTo({top: 0}); } });
show(location.hash.slice(1));

const lb = $('#lb');
document.addEventListener('click', e => {
  const img = e.target.closest('[data-lb]');
  if (img) { $('#lbi').src = img.dataset.lb; $('#lbd').href = img.dataset.lb; lb.hidden = false; return; }
  if (e.target.closest('#lbx') || e.target === lb) { lb.hidden = true; return; }
  const more = e.target.closest('.more');
  if (more) { const t = more.previousElementSibling; t.classList.toggle('clamp'); more.textContent = t.classList.contains('clamp') ? 'ادامه‌ی متن' : 'بستن'; return; }
  const yt = e.target.closest('[data-yt]');
  if (yt) { yt.outerHTML = `<div class="thumb"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(yt.dataset.yt)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.hidden = true; });
$('#theme').addEventListener('click', () => {
  const r = document.documentElement, dark = getComputedStyle(r).getPropertyValue('--bg').trim() === '#13120e';
  r.dataset.theme = dark ? 'light' : 'dark';
});
setTimeout(() => { if (lb.hidden && !document.activeElement.matches?.('input')) location.reload(); }, 30 * 60 * 1000);
</script>
</body>
